# Pre-commit — validações antes de cada commit
# Documentação: https://pre-commit.com
#
# Primeira vez no Dev Container: o script scripts/post-create.sh executa
#   pre-commit install --install-hooks
#
# Rodar manualmente em todos os arquivos:
#   pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^\.env\.example$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1-1
    hooks:
      - id: shellcheck
        args: [-x]
        files: ^scripts/.*\.sh$

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        files: ^\.devcontainer/Dockerfile$
